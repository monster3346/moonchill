<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Moon Chill - Đang phát</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f0f;
      --accent: #e50914;
      --text: #ffffff;
      --glass: rgba(20, 20, 20, 0.7);
      --radius: 16px;
      --transition: .4s cubic-bezier(.25,.8,.25,1);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      background:radial-gradient(ellipse at top, #1b1b1b 0%, #0a0a0a 100%);
      color:var(--text);
      font-family:'Inter',sans-serif;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      animation:fadeIn .8s;
    }
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}

    /* HEADER - GLASS */
    header{
      display:flex;align-items:center;justify-content:space-between;
      padding:18px 50px;background:var(--glass);backdrop-filter:blur(12px);
      position:sticky;top:0;z-index:1000;border-bottom:1px solid rgba(255,255,255,.08)
    }
    header .logo{font-size:2rem;font-weight:700;color:var(--accent);letter-spacing:1px}
    .back-btn{
      background:var(--accent);color:#fff;border:none;padding:.7rem 1.5rem;border-radius:30px;
      cursor:pointer;font-weight:600;transition:var(--transition)
    }
    .back-btn:hover{background:#f40612;transform:scale(1.05)}

    /* MAIN LAYOUT */
    main{flex:1;display:flex;flex-direction:column;align-items:center;padding:50px 20px;gap:2.5rem}

    /* TRAILER - AUTO PHÁT CÓ TIẾNG, KHÔNG TÙY CHỈNH VOLUME NGOÀI */
    .trailer-box{
      width:100%;max-width:1100px;aspect-ratio:16/9;border-radius:var(--radius);
      overflow:hidden;box-shadow:0 15px 50px rgba(229,9,20,.45);position:relative;
      transition:var(--transition)
    }
    .trailer-box:hover{transform:scale(1.01)}
    #trailerPlayer{width:100%;height:100%;border:none}

    /* INFO CARD */
    .info-card{
      width:100%;max-width:1100px;background:var(--glass);backdrop-filter:blur(12px);
      border-radius:var(--radius);padding:30px;display:grid;grid-template-columns:160px 1fr;gap:30px;align-items:start
    }
    .info-card img{width:160px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
    .details h2{font-size:2rem;margin-bottom:.5rem}
    .details .meta{font-size:.9rem;opacity:.7;margin-bottom:1rem}
    .details .meta span{margin-right:15px}
    .overview{font-size:1rem;line-height:1.7;opacity:.9}

    /* PLAYER SECTION */
    .player-section{
      width:100%;max-width:1100px; background:var(--glass);border-radius:var(--radius);
      padding:25px;backdrop-filter:blur(12px)
    }
    .player-title{font-size:1.3rem;margin-bottom:1rem;font-weight:600}
    #playerWrap{
      width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;
      box-shadow:0 10px 40px rgba(0,0,0,.6)
    }
    #player{width:100%;height:100%;display:block}

    /* OPTIONS */
    .opts{
      display:flex;gap:1rem;flex-wrap:wrap;margin-top:1.5rem
    }
    input[type="file"]{display:none}
    label[for="localFile"]{
      background:var(--accent);color:#fff;padding:.75rem 1.5rem;border-radius:30px;
      cursor:pointer;font-weight:600;transition:var(--transition)
    }
    label[for="localFile"]:hover{transform:scale(1.05)}
    #customUrl{
      flex:1;min-width:250px;padding:.75rem 1rem;border-radius:30px;border:none;outline:none;
      background:rgba(255,255,255,.1);color:#fff;transition:background .3s
    }
    #customUrl:focus{background:rgba(255,255,255,.2)}
    button{
      background:#333;color:#fff;border:none;padding:.75rem 1.5rem;border-radius:30px;
      cursor:pointer;font-weight:600;transition:var(--transition)}
    button:hover{background:#444;transform:scale(1.05)}

    /* FOOTER */
    footer{
      text-align:center;padding:20px;font-size:.9rem;opacity:.6;background:#000
    }

    /* RESPONSIVE */
    @media (max-width:768px){
      header{padding:15px 20px}
      .info-card{grid-template-columns:1fr;text-align:center}
      .opts{flex-direction:column;align-items:center}
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">Moon Chill</div>
    <button class="back-btn" onclick="history.back()">Quay lại</button>
  </header>

  <main>
    <!-- TRAILER AUTO PHÁT CÓ TIẾNG, KHÔNG TÙY CHỈNH VOLUME NGOÀI -->
    <div class="trailer-box">
      <iframe id="trailerPlayer" allowfullscreen></iframe>
    </div>

    <!-- INFO PHIM -->
    <div class="info-card">
      <img id="poster" src="" alt="Poster">
      <div class="details">
        <h2 id="mTitle">...</h2>
        <div class="meta">
          <span id="mYear"></span>
          <span id="mGenres"></span>
          <span id="mRuntime"></span>
        </div>
        <p id="mOverview" class="overview"></p>
      </div>
    </div>

    <!-- PLAYER CHÍNH -->
    <div class="player-section">
      <div class="player-title">Xem phim</div>
      <div id="playerWrap">
        <video id="player" controls style="display:none;"></video>
      </div>
      <div class="opts">
        <label for="localFile">📁 Chọn phim từ máy</label>
        <input type="file" id="localFile" accept="video/*">
        <input id="customUrl" placeholder="Hoặc dán link embed phim (Drive/Fembed...)">
        <button onclick="applyCustom()">Xem phim</button>
      </div>
    </div>
  </main>

  <footer>© 2025 Moon Chill</footer>

  <script>
    const API_KEY = '06e0e61c431aedf92744213b2e14ad02';
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const title = params.get('title') || 'Phim không tên';

    /* ====== ELEMENTS ====== */
    const trailerPlayer = document.getElementById('trailerPlayer');
    const player = document.getElementById('player');
    const fileInp = document.getElementById('localFile');
    const customUrl = document.getElementById('customUrl');

    /* ====== AUTO FETCH TRAILER + INFO ====== */
    (async () => {
      if (!id) {
        trailerPlayer.style.display = 'none';
        return;
      }
      try {
        const [vidRes, detailRes] = await Promise.all([
          fetch(`https://api.themoviedb.org/3/movie/${id}/videos?api_key=${API_KEY}&language=vi-VN`),
          fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${API_KEY}&language=vi-VN`)
        ]);
        const vidData = await vidRes.json();
        const detail = await detailRes.json();

        // trailer: KHÔNG mute → có tiếng, không hiển thị volume ngoài
        const key = vidData.results?.find(v => v.type === 'Trailer' && v.site === 'YouTube')?.key;
        if (key) {
          trailerPlayer.src = `https://www.youtube.com/embed/${key}?autoplay=1`;
        } else {
          trailerPlayer.style.display = 'none';
        }

        // info
        document.getElementById('mTitle').textContent = detail.title || title;
        document.getElementById('mOverview').textContent = detail.overview;
        document.getElementById('mYear').textContent = (detail.release_date || '').slice(0, 4);
        document.getElementById('mGenres').textContent = detail.genres.map(g => g.name).join(', ');
        document.getElementById('mRuntime').textContent = detail.runtime ? `${detail.runtime} phút` : '';
        document.getElementById('poster').src = `https://image.tmdb.org/t/p/w500${detail.poster_path}`;

      } catch (e) {
        console.error(e);
        trailerPlayer.style.display = 'none';
      }
    })();

    /* ====== LOCAL FILE ====== */
    fileInp.addEventListener('change', function () {
      const file = this.files[0];
      if (!file) return;
      if (!file.type.startsWith('video/')) {
        alert('Vui lòng chọn file video!');
        return;
      }
      const url = URL.createObjectURL(file);
      player.src = url;
      player.style.display = 'block';
      trailerPlayer.style.display = 'none';
    });

    /* ====== EMBED LINK ====== */
    function applyCustom() {
      const url = customUrl.value.trim();
      if (!url) return alert('Chưa nhập link!');
      player.src = url;
      player.style.display = 'block';
      trailerPlayer.style.display = 'none';
    }
  </script>
</body>
</html>
